<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOMBO — app volume example</title>
<link rel="stylesheet" href="../tombo.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&family=M+PLUS+2:wght@450;500;700&family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap" rel="stylesheet">
<style>
  .shell { max-width: 1100px; margin: 0 auto; padding: 0 32px; }
  .top { border-bottom: 1px solid var(--tombo-hairline); padding: 16px 0; }
  .top .shell { display: flex; align-items: center; gap: 28px; }
  .logo { font-family: var(--tombo-font-display); font-weight: 700; font-size: 14px; }
  .top .tombo-tabs { border-bottom: 0; flex: 1; }
  .me { margin-left: auto; font-size: var(--tombo-text-label); color: var(--tombo-ink-faint); }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 32px 0 24px; }
  .tombo-metric .v small { font-size: var(--tombo-text-note); color: var(--tombo-ink-faint); font-weight: 400; }
  .tombo-metric .tombo-ruler { margin-top: 12px; height: 14px; }
  main { padding-bottom: 40px; }
  @media (max-width: 640px) {
    .metrics { grid-template-columns: 1fr; }
    .top .shell { flex-wrap: wrap; gap: 14px; }
  }
  .tombo-themectl button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0; cursor: pointer; font: inherit; color: inherit; }
  .tombo-themectl button[aria-pressed="true"] { border-bottom-color: var(--tombo-shu); }
  .foot { display: flex; align-items: center; gap: 18px; }
</style>
</head>
<body>

  <div class="top">
    <div class="shell">
      <span class="logo">SCREENBOOK</span>
      <nav class="tombo-tabs">
        <a href="#" aria-current="page">画面一覧</a>
        <a href="#">依存グラフ</a>
        <a href="#">変更影響</a>
      </nav>
      <span class="me tombo-mono">wadakatu@prod / REV 4.2.1</span>
    </div>
  </div>

  <main class="shell">
    <div class="metrics">
      <div class="tombo-metric tombo-corners">
        <b class="tombo-corner-tr"></b><b class="tombo-corner-bl"></b>
        <div class="k">SCREENS</div>
        <div class="v">128</div>
        <div class="tombo-ruler" style="--tombo-ruler-value:78%"></div>
      </div>
      <div class="tombo-metric tombo-corners">
        <b class="tombo-corner-tr"></b><b class="tombo-corner-bl"></b>
        <div class="k">COVERAGE</div>
        <div class="v">96.2<small>%</small></div>
        <div class="tombo-ruler" style="--tombo-ruler-value:96%"></div>
      </div>
      <div class="tombo-metric tombo-corners">
        <b class="tombo-corner-tr"></b><b class="tombo-corner-bl"></b>
        <div class="k">BROKEN LINKS</div>
        <div class="v">3</div>
        <div class="tombo-ruler" style="--tombo-ruler-value:4%"></div>
      </div>
    </div>

    <table class="tombo-table">
      <thead>
        <tr><th>SCREEN</th><th>ROUTE</th><th>UPDATED</th><th>STATUS</th></tr>
      </thead>
      <tbody>
        <tr><td>ログイン</td><td class="tombo-mono">/login</td><td class="tombo-mono">2026-07-18</td><td><span class="tombo-chip" data-status="ok">OK</span></td></tr>
        <tr><td>ダッシュボード</td><td class="tombo-mono">/dashboard</td><td class="tombo-mono">2026-07-20</td><td><span class="tombo-chip" data-status="ok">OK</span></td></tr>
        <tr><td>設定 / 通知</td><td class="tombo-mono">/settings/notify</td><td class="tombo-mono">2026-07-11</td><td><span class="tombo-chip" data-status="err">MISSING</span></td></tr>
      </tbody>
    </table>
  </main>

  <footer class="tombo-footer">
    <div class="shell foot">
      <span class="tombo-logo" aria-hidden="true"><i class="h"></i><i class="b"></i><i class="w1"></i><i class="w2"></i><i class="t"></i></span>
      <div>
      TOMBO — WADAKATU DESIGN SYSTEM · APP VOLUME EXAMPLE — EXAMPLES/APP.HTML · REV 4.2.1
      <div class="tombo-themectl tombo-label" hidden>
        <button type="button" data-t="tombo">tombo</button>
        <button type="button" data-t="hotaru">hotaru</button>
      </div>
      </div>
    </div>
  </footer>

  <script>
    const ctl = document.querySelector('.tombo-themectl');
    ctl.hidden = false;
    const ctlBtns = ctl.querySelectorAll('button');
    const syncCtl = () => {
      const t = document.documentElement.dataset.theme ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'hotaru' : 'tombo');
      ctlBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
    };
    syncCtl();
    ctl.addEventListener('click', e => {
      const t = e.target.dataset.t;
      if (t) { document.documentElement.dataset.theme = t; syncCtl(); }
    });
  </script>
</body>
</html>
