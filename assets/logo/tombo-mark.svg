<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="color:#0E5A47">
  <title>TOMBO — 見当 (registration dragonfly)</title>
  <!-- head -->
  <circle cx="50" cy="13" r="6" fill="none" stroke="currentColor" stroke-width="3.5"/>
  <!-- body -->
  <line x1="50" y1="19" x2="50" y2="84" stroke="currentColor" stroke-width="3.5"/>
  <!-- wings: two registration bars -->
  <line x1="10" y1="36" x2="90" y2="36" stroke="currentColor" stroke-width="3.5"/>
  <line x1="22" y1="48" x2="78" y2="48" stroke="currentColor" stroke-width="3.5"/>
  <!-- tail: shu marks the current position -->
  <line x1="50" y1="84" x2="50" y2="96" stroke="#D8442B" stroke-width="3.5"/>
</svg>
