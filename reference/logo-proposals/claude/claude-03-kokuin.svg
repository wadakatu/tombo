<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="color:#1A211D">
  <title>TOMBO — 刻印 (measured wordmark)</title>
  <text x="50" y="52" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="900" letter-spacing="-0.4" fill="currentColor">TOMBO</text>
  <!-- dimension line under the wordmark: the name, measured -->
  <line x1="9" y1="62" x2="9" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="91" y1="62" x2="91" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="9" y1="66" x2="91" y2="66" stroke="currentColor" stroke-width="2"/>
  <!-- current position tick on the measure -->
  <line x1="62" y1="60" x2="62" y2="72" stroke="#D8442B" stroke-width="2.4"/>
</svg>
